[project]
name = "latentvis"
version = "0.1.0"
requires-python = ">=3.10"
authors = [{name = "Rostyslav Hnatyshyn", email="rostyslav.hnatyshyn@gmail.com"}
]
dependencies = [
    "notebookjs>=0.1.4",
]


[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.uv]
package=true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
